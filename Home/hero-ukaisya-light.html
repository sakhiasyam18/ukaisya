<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ukaisya — Manis Alami dari Tebu Pilihan</title>
  <meta name="description"
    content="Ukaisya oleh PT Tiga Dewi Timur Raya — Produsen gula merah tebu berkualitas dari Kediri sejak 1997. Melayani industri, HORECA, dan rumah tangga.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'display': ['"Plus Jakarta Sans"', 'sans-serif'],
            'body': ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            'ukaisya': {
              orange: '#ff6b00',
              green: '#22c55e',
              dark: '#1f2937',
              light: '#f9fafb',
            }
          },
          boxShadow: {
            'soft': '0 20px 40px -15px rgba(0,0,0,0.05)',
            'glow': '0 0 40px rgba(255, 107, 0, 0.15)',
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    html.lenis,
    html.lenis body {
      height: auto;
      width: 100vw;
      overflow-x: hidden;
    }

    .lenis.lenis-smooth {
      scroll-behavior: auto !important;
    }

    .lenis.lenis-smooth [data-lenis-prevent] {
      overscroll-behavior: contain;
    }

    .lenis.lenis-stopped {
      overflow: hidden;
    }

    .lenis.lenis-scrolling iframe {
      pointer-events: none;
    }

    body {
      background-color: #ffffff;
      color: #1f2937;
    }

    /* Subtle background grid */
    .bg-grid {
      background-size: 40px 40px;
      background-image: linear-gradient(to right, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
      mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
    }

    /* Button Hover Effect */
    .btn-orange {
      background: linear-gradient(135deg, #ff8a00, #ff6b00);
      transition: all 0.3s ease;
    }

    .btn-orange:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(255, 107, 0, 0.4);
    }
  </style>
</head>

<body class="font-body antialiased relative">

  <!-- Background Grid -->
  <div class="fixed inset-0 bg-grid pointer-events-none z-[-1]"></div>



  <!-- ============================================ -->
  <!-- HERO SECTION                                 -->
  <!-- ============================================ -->
  <section class="relative pt-32 pb-20 lg:pt-40 lg:pb-32 overflow-hidden">
    <div class="max-w-7xl mx-auto px-6 lg:px-8">

      <!-- Center Content -->
      <div class="flex flex-col items-center text-center max-w-4xl mx-auto space-y-8 relative z-10">

        <!-- Eyebrow -->
        <div
          class="motion-hero-text inline-flex flex-wrap items-center justify-center gap-2 px-4 py-2 rounded-full bg-orange-50 border border-orange-100 text-ukaisya-orange font-semibold text-xs sm:text-sm text-center">
          <span class="text-base sm:text-lg">🍯</span> Ukaisya - PT Tiga Dewi Timur Raya &bull; Sejak 1997
        </div>

        <!-- Headline -->
        <h1
          class="motion-hero-text text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-extrabold tracking-tight text-gray-900 leading-[1.1]">
          Pengolahan Tebu & <br>
          <span class="text-[#ff6b00]">Gula Merah Tebu</span>
        </h1>

        <!-- Description -->
        <p
          class="motion-hero-text text-base sm:text-lg md:text-xl text-gray-500 max-w-3xl leading-relaxed px-2 sm:px-0">
          Pusat pengolahan gula merah tebu berkualitas langsung dari <span class="font-bold text-gray-700">Desa Ngetrep,
            Kecamatan Mojo, Kabupaten Kediri, Jawa Timur, Indonesia</span>.
        </p>

        <!-- CTA Buttons -->
        <div
          class="motion-hero-text flex flex-col sm:flex-row w-full justify-center items-center gap-3 sm:gap-4 pt-4 px-4 sm:px-0">
          <a href="https://ukaisya.id/toko-online/"
            class="btn-orange text-white font-bold py-3.5 px-8 sm:py-4 rounded-full text-sm sm:text-base lg:text-lg shadow-glow w-full sm:w-auto">
            Lihat Produk
          </a>
        </div>

        <!-- Trust Badges -->
        <div
          class="motion-hero-text flex flex-wrap items-center justify-center gap-4 sm:gap-6 pt-4 sm:pt-6 opacity-70 px-2">
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 sm:w-5 sm:h-5 text-green-500" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                clip-rule="evenodd"></path>
            </svg>
            <span class="text-xs sm:text-sm font-semibold text-gray-600">Sertifikasi HALAL</span>
          </div>
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 sm:w-5 sm:h-5 text-green-500" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                clip-rule="evenodd"></path>
            </svg>
            <span class="text-xs sm:text-sm font-semibold text-gray-600">BPOM</span>
          </div>
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 sm:w-5 sm:h-5 text-green-500" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                clip-rule="evenodd"></path>
            </svg>
            <span class="text-xs sm:text-sm font-semibold text-gray-600">100% Produk Lokal Kediri</span>
          </div>
        </div>

      </div>

      <!-- Hero Image / Banner Hook -->
      <div
        class="mt-12 sm:mt-16 lg:mt-24 relative mx-auto max-w-5xl rounded-2xl sm:rounded-3xl overflow-hidden shadow-2xl motion-hero-image">
        <!-- Using a placeholder image that represents brown sugar / sugarcane aesthetic -->
        <img src="https://i.ibb.co.com/S4NtQrm5/Whats-App-Image-2026-09-22-at-13-21-12.jpg"
          alt="Ukaisya Gula Merah Tebu Premium Banner"
          class="w-full h-auto aspect-[4/3] sm:aspect-[16/9] lg:aspect-[21/9] object-cover" />

        <!-- Decorative Overlay Gradient -->
        <div class="absolute inset-0 bg-gradient-to-t from-black/50 sm:from-black/40 via-transparent to-transparent">
        </div>

      </div>

    </div>
  </section>

  <!-- Scripts: Lenis for Smooth Scroll & Motion for Animations -->
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script type="module">
    import { animate, stagger, spring } from "https://cdn.jsdelivr.net/npm/motion@11.11.13/+esm";

    // Initialize Lenis
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      direction: 'vertical',
      gestureDirection: 'vertical',
      smooth: true,
      mouseMultiplier: 1,
      smoothTouch: false,
      touchMultiplier: 2,
      infinite: false,
    });

    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    // Animations using Motion
    document.addEventListener("DOMContentLoaded", () => {
      animate(".motion-element",
        { y: [-20, 0], opacity: [0, 1] },
        { delay: stagger(0.1), duration: 0.8, easing: [0.22, 1, 0.36, 1] }
      );
      animate(".motion-hero-text",
        { y: [40, 0], opacity: [0, 1] },
        { delay: stagger(0.15, { start: 0.3 }), duration: 1, easing: spring({ stiffness: 100, damping: 20 }) }
      );
      animate(".motion-hero-image",
        { y: [80, 0], opacity: [0, 1], scale: [0.95, 1] },
        { delay: 0.9, duration: 1.2, easing: [0.22, 1, 0.36, 1] }
      );
    });
  </script>

</body>

</html>
